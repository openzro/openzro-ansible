---
# Install nginx, render the openzro site, and acquire/install a
# TLS cert via the operator-chosen mode (default: certbot HTTP-01).

- name: Validate TLS mode
  ansible.builtin.assert:
    that:
      - openzro_tls_mode in ["certbot_http", "certbot_dns", "byo", "self_signed"]
    fail_msg: >-
      openzro_tls_mode must be one of: certbot_http, certbot_dns,
      byo, self_signed. Got: '{{ openzro_tls_mode }}'.

- name: Install nginx
  ansible.builtin.package:
    name: "{{ openzro_nginx_package }}"
    state: present

# nginx's grpc_socket_keepalive only sets SO_KEEPALIVE; the timings are
# these system-wide sysctls. With the gRPC timeouts raised past any
# plausible idle period, this is what actually reaps a vanished peer —
# without it the default 7200s idle holds a dead stream for over two
# hours. See the openzro_nginx_tcp_keepalive_* defaults for why this is
# system-wide and how to opt out.
- name: Tune TCP keepalive so dead gRPC peers are detected promptly
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-openzro-nginx-keepalive.conf
    sysctl_set: true
    state: present
    reload: true
  loop:
    - name: net.ipv4.tcp_keepalive_time
      value: "{{ openzro_nginx_tcp_keepalive_time }}"
    - name: net.ipv4.tcp_keepalive_intvl
      value: "{{ openzro_nginx_tcp_keepalive_intvl }}"
    - name: net.ipv4.tcp_keepalive_probes
      value: "{{ openzro_nginx_tcp_keepalive_probes }}"
  loop_control:
    label: "{{ item.name }} = {{ item.value }}"
  when: openzro_nginx_tune_tcp_keepalive | bool

- name: Ensure openzro tls dir exists
  ansible.builtin.file:
    path: /etc/openzro/tls
    state: directory
    owner: root
    group: root
    mode: "0750"

# Cert acquisition — included file per mode keeps each path
# self-contained and easy to skip when ansible -t is used to
# target only one of them.
- name: Acquire TLS cert (certbot HTTP-01)
  ansible.builtin.include_tasks: cert-certbot-http.yml
  when: openzro_tls_mode == "certbot_http"

- name: Acquire TLS cert (certbot DNS-01)
  ansible.builtin.include_tasks: cert-certbot-dns.yml
  when: openzro_tls_mode == "certbot_dns"

- name: Install operator-provided cert
  ansible.builtin.include_tasks: cert-byo.yml
  when: openzro_tls_mode == "byo"

- name: Generate self-signed cert (lab/dev)
  ansible.builtin.include_tasks: cert-self-signed.yml
  when: openzro_tls_mode == "self_signed"

# Site config + activation. On Debian the stock sites-enabled/default
# stays in place — the openzro site uses the operator's hostname only,
# so the two won't collide. On RHEL/Fedora nginx.conf's own
# `include /etc/nginx/conf.d/*.conf` is the activation, so dropping
# the file in place is the whole step and there's no symlink to make.
- name: Render openzro nginx site
  ansible.builtin.template:
    src: openzro.conf.j2
    dest: "{{ openzro_nginx_site_path }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: reload nginx

- name: Enable openzro nginx site
  ansible.builtin.file:
    src: "{{ openzro_nginx_site_path }}"
    dest: "{{ openzro_nginx_enabled_path }}"
    state: link
  notify: reload nginx
  when: openzro_nginx_enabled_path | length > 0

# A bad render must not reach a reload. Failing here aborts the play
# before handlers flush, so the running nginx keeps serving the config
# it already loaded; `backup: true` above leaves the previous file
# next to it for the diff.
- name: Validate the full nginx config
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
  when: openzro_nginx_validate_config | bool

- name: Ensure nginx is running and enabled
  ansible.builtin.systemd:
    name: "{{ openzro_nginx_service }}"
    enabled: true
    state: started
