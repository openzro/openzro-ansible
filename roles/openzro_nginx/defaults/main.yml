---
# nginx in front of the openzro stack — terminates TLS, proxies the
# REST + gRPC paths to the management/signal upstreams, optionally
# serves the dashboard static bundle from a sibling package.

openzro_nginx_package: nginx
openzro_nginx_service: nginx
openzro_nginx_site_name: openzro

# The two distros disagree on how a site gets activated:
#
#   Debian/Ubuntu  sites-available/<name> + a symlink into
#                  sites-enabled/, which nginx.conf includes.
#   RHEL/Fedora    conf.d/<name>.conf, which nginx.conf already
#                  includes. There is no sites-available directory
#                  at all — the old hardcoded path meant the
#                  template task failed outright on these hosts.
#
# An empty openzro_nginx_enabled_path means "activation is just
# dropping the file in place", and the symlink task is skipped.
openzro_nginx_site_path: >-
  {{ '/etc/nginx/sites-available/' ~ openzro_nginx_site_name
     if ansible_os_family == 'Debian'
     else '/etc/nginx/conf.d/' ~ openzro_nginx_site_name ~ '.conf' }}
openzro_nginx_enabled_path: >-
  {{ '/etc/nginx/sites-enabled/' ~ openzro_nginx_site_name
     if ansible_os_family == 'Debian' else '' }}

# Run `nginx -t` after rendering and fail the play on a bad config,
# before the reload handler fires — so a broken template leaves the
# running nginx serving what it already loaded.
openzro_nginx_validate_config: true

# Set to false to skip dashboard serving entirely — useful if you
# front the dashboard with something else (Cloudflare Pages,
# S3+CloudFront, etc.).
openzro_nginx_serve_dashboard: true

# How the dashboard is served, which follows how it was installed:
#
#   static  Serve the unpacked bundle from disk. Only possible where
#           the openzro-dashboard package exists — i.e. APT hosts.
#   proxy   Reverse-proxy to the dashboard container on loopback.
#           What Fedora / RHEL / Rocky / Alma get, since there is no
#           dashboard rpm and the podman/docker install methods are
#           the only ones available there.
#
# `auto` mirrors openzro_dashboard_install_method's own auto rule, so
# the two roles agree without the operator setting anything. It's
# re-derived rather than read off the dashboard role because site.yml
# runs them in separate plays.
openzro_nginx_dashboard_mode: >-
  {{ 'static'
     if (openzro_dashboard_install_method | default('auto')) == 'package'
        or ((openzro_dashboard_install_method | default('auto')) == 'auto'
            and ansible_os_family == 'Debian')
     else 'proxy' }}

# static mode — where the deb drops the bundle.
openzro_nginx_dashboard_root: /usr/share/openzro-dashboard

# proxy mode — must match openzro_dashboard_publish's host:port.
openzro_nginx_dashboard_upstream: "127.0.0.1:8080"

# Upstream addresses — tweak per inventory if the management /
# signal hosts aren't on the same machine as nginx. The default
# assumes all-in-one (nginx, mgmt, signal on the same host).
openzro_nginx_management_rest_upstream: "127.0.0.1:33071"
openzro_nginx_management_grpc_upstream: "127.0.0.1:33073"
openzro_nginx_signal_grpc_upstream: "127.0.0.1:10000"

# ---------------------------------------------------------------------
# gRPC stream lifetime.
#
# The management Sync and signal ConnectStream are long-lived and
# mostly idle — the signal one carries data only while a peer
# connection is being set up, so on a quiet mesh it can idle for days.
# A proxy timeout shorter than that tears the stream down without
# either end noticing: the client keeps reporting "Connected" over a
# socket that is gone, while signal has already deregistered the peer.
# Messages addressed to it are then dropped, with a 200 returned to
# the sender, until something restarts the client.
#
# 86400s was the old value and it is exactly the wrong one: it cuts a
# healthy stream at 24h of silence. Idle is not dead. The timeout is
# raised past any plausible idle period and death is detected instead
# by TCP keepalive, below.
#
# 24d is a round "effectively never", not a limit — nginx parses far
# larger values fine (verified: 25d also loads). It is deliberately not
# 0/infinite, so a genuinely wedged stream still has a backstop.
# ---------------------------------------------------------------------
openzro_nginx_grpc_read_timeout: "24d"
openzro_nginx_grpc_send_timeout: "24d"

# TCP keepalive for the gRPC sockets. nginx's grpc_socket_keepalive
# only flips SO_KEEPALIVE on; the timings come from these system-wide
# sysctls, whose defaults (7200s idle, then 9 probes at 75s) leave a
# vanished peer holding its stream for over two hours. At the values
# below it is reaped in ~6.5 minutes.
#
# These are system-wide, not per-socket — every TCP connection on the
# host gets them. That is fine for a dedicated proxy host and is the
# only knob nginx exposes; set openzro_nginx_tune_tcp_keepalive to
# false to leave the host's sysctls alone.
openzro_nginx_tune_tcp_keepalive: true
openzro_nginx_tcp_keepalive_time: 300
openzro_nginx_tcp_keepalive_intvl: 30
openzro_nginx_tcp_keepalive_probes: 3

# ---------------------------------------------------------------------
# TLS — pick a mode. The role implements four:
#
#   certbot_http  (default) — Let's Encrypt via HTTP-01. Host must be
#                             reachable from the internet on port 80.
#                             Cheapest setup, auto-renews via the
#                             certbot.timer systemd unit. REQUIRES
#                             openzro_tls_email to be set.
#
#   certbot_dns           — Let's Encrypt via DNS-01. Works behind
#                             a firewall and supports wildcard certs.
#                             Currently the role implements Cloudflare
#                             only; PRs welcome for Route53 / Google.
#
#   byo                  — Bring-your-own cert (internal CA, paid
#                             cert, etc.). Operator points at PEM
#                             files on the control host.
#
#   self_signed          — Generate a self-signed cert on first run.
#                             Lab / dev only — clients warn loudly.
# ---------------------------------------------------------------------
openzro_tls_mode: certbot_http

# certbot_http / certbot_dns
openzro_tls_email: ""              # admin email LE uses for renewal warnings

# certbot_dns — DNS provider plugin and credentials
openzro_tls_dns_provider: cloudflare    # only cloudflare is implemented
openzro_tls_cloudflare_api_token: ""    # vault-encrypt this

# byo — paths on the CONTROL host (Ansible reads them with file
# lookup and pushes the contents). The role copies to
# /etc/openzro/tls/{cert,key}.pem on the target.
openzro_tls_cert_path: ""
openzro_tls_key_path: ""

# Computed by the cert tasks — paths on the TARGET host nginx
# serves from. Don't override unless you're bypassing the
# included cert tasks.
openzro_tls_cert_effective: "/etc/openzro/tls/cert.pem"
openzro_tls_key_effective: "/etc/openzro/tls/key.pem"
