---
- name: Install openzro-relay package (apt)
  ansible.builtin.apt:
    name: "{{ openzro_relay_package }}{{ ('=' + openzro_version) if openzro_version | default('') | length > 0 else '' }}"
    state: present
    update_cache: true
  when: ansible_pkg_mgr == "apt"
  notify: Restart openzro-relay

- name: Install openzro-relay package (dnf/yum)
  ansible.builtin.dnf:
    name: "{{ openzro_relay_package }}{{ ('-' + openzro_version) if openzro_version | default('') | length > 0 else '' }}"
    state: present
    update_cache: true
  when: ansible_pkg_mgr in ["dnf", "yum"]
  notify: Restart openzro-relay

- name: Render systemd EnvironmentFile
  ansible.builtin.template:
    src: openzro-relay.env.j2
    dest: "{{ openzro_relay_env_file }}"
    owner: root
    group: openzro
    mode: "0640"
    backup: true
  notify: Restart openzro-relay

- name: Enable + start openzro-relay
  ansible.builtin.systemd:
    name: "{{ openzro_relay_service }}"
    enabled: true
    state: started
    daemon_reload: true

# ---------------------------------------------------------------
# Optional: issue TLS cert for the relay's public address via Let's
# Encrypt's DNS-01 challenge using one of the supported providers.
# Default `none` skips this entirely — operators terminate TLS
# upstream (LB, nginx) or stage a non-LE cert manually.
# ---------------------------------------------------------------

- name: Issue / renew TLS cert via certbot DNS-01
  ansible.builtin.import_tasks: certbot/main.yml
  when: openzro_relay_cert_provider != "none"

# ---------------------------------------------------------------
# certbot renewal deploy-hook + initial cert tree open.
#
# The hook fires regardless of who issued the cert (this role's
# certbot pipeline OR an external certbot run) — it only reacts
# to RENEWED_LINEAGE matching openzro_relay_public_address. Two
# triggers run it:
#
# - openzro_relay_certbot_renew_hook == true (explicit opt-in for
#   operators who issue certs OUTSIDE this role).
# - openzro_relay_cert_provider != "none" (the role issues the
#   cert itself; renewal handling is implied).
#
# The shell task below reapplies the same chgrp/chmod the hook
# does — needed for the pre-first-renewal window where certbot
# just issued the cert and the relay needs to read it now.
# ---------------------------------------------------------------

- name: Ensure certbot deploy-hook directory exists
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: openzro_relay_certbot_renew_hook or openzro_relay_cert_provider != "none"

- name: Render certbot deploy-hook for openzro-relay
  ansible.builtin.template:
    src: openzro-relay-renew.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/openzro-relay.sh
    owner: root
    group: root
    mode: "0755"
  when: openzro_relay_certbot_renew_hook or openzro_relay_cert_provider != "none"

# ACL on /etc/letsencrypt was unreliable — privkey1.pem under
# /etc/letsencrypt/archive/<domain>/ stays mode 0600 root:root no
# matter what setfacl -R does because certbot recreates it on every
# renewal. Going direct: chgrp the cert tree to the relay group and
# chmod g+r on files. Idempotent (find -exec is a no-op when bits
# are already set) and matches what the deploy-hook re-applies after
# every renewal — running both keeps the daemon readable in the
# pre-first-renewal window too.
- name: Open Let's Encrypt cert tree for the relay group to read
  ansible.builtin.shell: |
    set -euo pipefail
    chgrp -R {{ openzro_relay_group }} /etc/letsencrypt/archive /etc/letsencrypt/live
    find /etc/letsencrypt/archive /etc/letsencrypt/live -type d -exec chmod 0750 {} +
    find /etc/letsencrypt/archive /etc/letsencrypt/live -type f -exec chmod 0640 {} +
  changed_when: false
  when: openzro_relay_certbot_renew_hook or openzro_relay_cert_provider != "none"
